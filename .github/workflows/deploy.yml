name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Restarting a pm2 process drops whatever it was mid-doing (every
          # player in a room, or a few seconds of Discord bot uptime), so a
          # push that only touches one process's own files shouldn't restart
          # the other two. Three independent processes now (confirmed
          # 2026-08-15): both rooms, plus the shared Discord bot — genuinely
          # independent of both since that date (see discordProcess.js's own
          # header comment for why: it used to be fork()'d from the main
          # room specifically, so restarting that room also killed and
          # respawned Discord, dropping BFF's own bridge connection along
          # with it even though BFF was never touched).
          #
          # Classification is by exact path, computed by walking each
          # process's actual require() graph (see the three entry points'
          # module trees) rather than guessed from directory names — files
          # shared by more than one process are NOT listed in any exclusive
          # bucket, so any file not recognized below (including new files
          # added later and forgotten here) falls through to the safe
          # default: restart all three.
          #
          # A separate bucket (tools/**, scripts/**, this workflow file
          # itself) restarts NONE of them: none of those are ever
          # require()'d by index.js/bffIndex.js/discordProcess.js or the two
          # browser entry points at runtime — both rooms build their bundle
          # fresh, in-memory, from entry.js/bffEntry.js's own graph on every
          # startup (see haxchill-vps-deployment project memory), so
          # tools/scripts are structurally unreachable from any running
          # process no matter what they contain. Editing this workflow file
          # doesn't need a restart either — GitHub Actions already read the
          # version at the trigger commit before this script started
          # running, so by the time this line executes, this run IS that
          # new version; there's no stale copy left running anywhere to
          # restart.
          script: |
            set -e
            cd /opt/haxlab
            OLD_HEAD=$(git rev-parse HEAD)
            git pull origin main
            NEW_HEAD=$(git rev-parse HEAD)
            npm ci

            CHANGED=$(git diff --name-only "$OLD_HEAD" "$NEW_HEAD")
            echo "Changed files since last deploy:"
            echo "$CHANGED"

            if [ -z "$CHANGED" ]; then
              echo "No file changes since last deploy — skipping restart."
            else
              RESTART_MAIN=false
              RESTART_BFF=false
              RESTART_DISCORD=false
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                case "$f" in
                  HaxBot_public.js|src/index.js|src/browser/entry.js|src/core/announcementMessages.js|src/core/announcements.js|src/core/betting.js|src/core/blackholeAnimation.js|src/core/cards.js|src/core/commands.js|src/core/commands/admin.js|src/core/commands/blackjack.js|src/core/commands/club.js|src/core/commands/minigames.js|src/core/commands/player.js|src/core/commands/poker.js|src/core/commands/trophies.js|src/core/economy.js|src/core/events/activity.js|src/core/events/gameManagement.js|src/core/events/movement.js|src/core/fireworksAnimation.js|src/core/pauseVote.js|src/core/pokerHandRank.js|src/core/shopItems.js|src/core/smokeAnimation.js|src/core/stadiums.js|src/core/stats/fetch.js|src/core/stats/roomStats.js|src/core/team/balance.js|src/core/team/buttons.js|src/core/team/choosing.js|src/core/team/swap.js)
                    RESTART_MAIN=true
                    ;;
                  src/bffIndex.js|HaxBotBFF_public.js|src/browser/bffEntry.js|src/core/bff/adminCall.js|src/core/bff/afk.js|src/core/bff/chatGuard.js|src/core/bff/commands.js|src/core/bff/config.js|src/core/bff/dbBridge.js|src/core/bff/events.js|src/core/bff/matchFlow.js|src/core/bff/rating.js|src/core/bff/report.js|src/core/bff/roomSetup.js|src/core/bff/roomStats.js|src/core/bff/stadiums.js|src/core/bff/threeDefLine.js)
                    RESTART_BFF=true
                    ;;
                  HaxDiscordBot_public.js|src/core/discord.js|src/core/discordProcess.js)
                    RESTART_DISCORD=true
                    ;;
                  tools/*|scripts/*|.github/workflows/deploy.yml)
                    # No-op — no restart flag is set. See this step's own
                    # top comment for why these are structurally inert.
                    ;;
                  *)
                    RESTART_MAIN=true
                    RESTART_BFF=true
                    RESTART_DISCORD=true
                    ;;
                esac
              done <<< "$CHANGED"

              if [ "$RESTART_MAIN" = false ] && [ "$RESTART_BFF" = false ] && [ "$RESTART_DISCORD" = false ]; then
                echo "Only dev-only/tooling files changed — nothing to restart."
              else
                [ "$RESTART_MAIN" = true ] && { echo "Restarting main room (haxlab)."; pm2 startOrReload ecosystem.config.js --only haxlab; }
                [ "$RESTART_BFF" = true ] && { echo "Restarting BFF room (haxlab-bff)."; pm2 startOrReload ecosystem.config.js --only haxlab-bff; }
                [ "$RESTART_DISCORD" = true ] && { echo "Restarting Discord bot (haxlab-discord)."; pm2 startOrReload ecosystem.config.js --only haxlab-discord; }
              fi
              pm2 save
            fi
